name: tests-and-build

on:
  push:
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q agenda main.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-core-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q agenda main.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-msix-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke import graphical interface
        run: python -c "from agenda.ui.main_window import MainWindow; from agenda.ui.widget import DesktopWidget; from agenda.ui.cards import ContestCard; from agenda.ui.details_dialog import ContestDetailsDialog; from agenda.ui.code_dialogs import ContestCodeDialog, PromptPage"
      - name: Smoke initialize graphical interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_ui.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build validation MSIX
        run: >-
          python packaging/build_msix.py
          --package-name AgendaDeConcursos.Validation
          --publisher "CN=AgendaDeConcursos Validation"
          --publisher-display-name "Agenda de Concursos (Validação)"
          --output dist/AgendaDeConcursos-validacao-x64.msix
      - name: Upload validation MSIX
        uses: actions/upload-artifact@v6
        with:
          name: Agenda-de-Concursos-MSIX-validacao-x64
          path: dist/AgendaDeConcursos-validacao-x64.msix
          if-no-files-found: error
          retention-days: 14
