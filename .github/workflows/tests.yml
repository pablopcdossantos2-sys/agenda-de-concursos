name: tests

on:
  push:
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q agenda main.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-core-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q agenda main.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
